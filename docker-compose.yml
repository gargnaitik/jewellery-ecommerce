version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: jewellery_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: jewellery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  mongodb:
    image: mongo:7
    container_name: jewellery_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7
    container_name: jewellery_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
  mongo_data:
